name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.1"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Unit tests (web)
        # Component tests share process-global happy-dom, auth, and fetch state.
        run: bun run test --filter=web -- --max-concurrency=1 --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload coverage to Codecov (web)
        if: ${{ always() && hashFiles('apps/web/coverage/lcov.info') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v4
        with:
          files: apps/web/coverage/lcov.info
          flags: web
          name: web-unit-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.1"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Unit tests (api)
        run: bun run test --filter=api -- --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Upload coverage to Codecov (api)
        if: ${{ always() && hashFiles('apps/api/coverage/lcov.info') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage/lcov.info
          flags: api
          name: api-unit-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-game-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.1'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Unit tests (game-core)
        run: bun run test --filter=@procyon/game-core

      - name: Lint (game-core)
        run: bun run lint --filter=@procyon/game-core

      - name: Typecheck (game-core)
        run: bun run typecheck --filter=@procyon/game-core
